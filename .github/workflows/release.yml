# Tag-only, self-disabling release workflow.
#
# The primary release path is local: `scripts/build-release-apk.sh --gh-release`
# builds + attaches the APK from the dev machine (zero CI minutes). This
# workflow only fires when a `v*` tag is pushed WITHOUT an APK already
# attached (e.g. a tag created from the GitHub web UI). If the local script
# already attached an APK, the job exits 0 immediately.
name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if an APK is already attached
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null | grep -q '\.apk$'; then
            echo "APK already attached to $tag; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up JDK
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        if: steps.check.outputs.skip == 'false'
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Attach APK to release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          sha7="$(git rev-parse --short=7 HEAD)"
          cp app/build/outputs/apk/debug/app-debug.apk "ledgerboy-${tag#v}.apk"
          gh release upload "$tag" "ledgerboy-${tag#v}.apk" --clobber
